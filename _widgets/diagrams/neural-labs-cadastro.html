<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Cadastro da Neural Labs</title>
  <link rel="stylesheet" href="../lumi-runtime.css">
  <link rel="stylesheet" href="../flow.css">

</head>
<body>
  <div class="widget-container"></div>
  <script type="application/json" id="flow-spec">
{
  "title": "Cadastro da Neural Labs",

  "nodes": [
    {
      "id": "a",

    },
    {

      "label": "NEURAL SERVER conecta\nna porta 17000"
    },
    {
      "id": "c",
      "label": "O IP bate com\no cadastrado?",

    {
      "id": "d",
      "label": "Última leitura anda\ne as câmeras aparecem\nem Aguardando vínculo",

    },
    {
      "id": "e",

      "kind": "muted"
    }
  ],
  "edges": [
    {
      "from": "a",
      "to": "b"
    },
    {
      "from": "b",
      "to": "c"
    },
    {
      "from": "c",
      "to": "d",
      "label": "sim"
    },
    {
      "from": "c",
      "to": "e",
