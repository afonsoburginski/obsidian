<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <link rel="stylesheet" href="../lumi-runtime.css">

</head>
<body>

{

    {
      "id": "app",

      "sub": "Kafka do equipamento",
      "kind": "accent"
    },
    {
      "id": "c",
      "label": "ms-cameras",
      "sub": "DeviceStreamConsumer"
    },
    {
      "id": "ws",
      "label": "Socket cameras-analytics",

    {
      "id": "log",
      "label": "CameraEventLog ANALYTICS",

    {

    {

    {
      "id": "occ",

    {

    },
    {

    {

    {
      "id": "raw",

    {

      "from": "app",
      "to": "c"

    {
      "from": "c",

    {
      "from": "c",
      "to": "log",
      "label": "incidente"
    },
    {
      "from": "log",
      "to": "fila"
    },
    {
      "from": "c",
      "to": "min",

    {
      "from": "c",
      "to": "occ",

    {
      "from": "tcp",

    {
      "from": "con",
      "to": "occ"
    },
    {
      "from": "occ",
      "to": "va"
    },
    {
      "from": "va",
      "to": "raw"
    },
    {
      "from": "raw",
      "to": "dh"
    },
    {
      "from": "occ",
      "to": "sp"
    }
  ]
