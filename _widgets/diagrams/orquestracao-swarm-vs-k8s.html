<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitetura de orquestracao: Docker Swarm vs Kubernetes</title>
  <link rel="stylesheet" href="../lumi-runtime.css">
  <script src="../widget-runtime.js"></script>
  <style>
    /* Widget layout glue */
    body {
      margin: 0;
      padding: 0;
      font-family: var(--ff-sans);
      color: var(--on-surface);
      background: transparent;
      overflow-y: hidden;
    }

    .widget-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: var(--spacing-m);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-m);
    }

    .header-section {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }

    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-s);
      flex-wrap: wrap;
    }

    .diagram-card {
      background: var(--surface-dim);
      border-radius: var(--r-l);
      padding: var(--spacing-m);
      box-sizing: border-box;
      position: relative;
    }

    .diagram-svg {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      overflow: visible;
    }

    /* SVG Diagram Node styling & hover states */
    .arch-node {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .arch-node:hover > rect,
    .arch-node:hover > path {
      stroke: var(--primary) !important;
      stroke-width: 2px !important;
    }

    .arch-node.is-selected > rect,
    .arch-node.is-selected > path {
      stroke: var(--primary) !important;
      stroke-width: 2.2px !important;
      fill: var(--accent-container) !important;
    }

    text {
      stroke: none !important;
      paint-order: fill;
      user-select: none;
    }

    .details-card {
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
      border-radius: var(--r-m);
      padding: var(--spacing-m);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      min-height: 84px;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .details-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-s);
    }

    .details-tag {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--primary);
      background: var(--accent-container);
      padding: 2px 8px;
      border-radius: var(--r-full);
      font-weight: 500;
    }

    .node-group {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .hidden-group {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- Header -->
    <div class="header-section">
      <div class="controls-bar">
        <div>
          <h2 class="lumi-headline-m" style="margin:0; color:var(--on-surface);">Arquitetura de Orquestração</h2>
          <p class="lumi-body-s" style="margin:2px 0 0 0; color:var(--on-surface-variant);">Compare o fluxo de deploy e os componentes internos</p>
        </div>
        <!-- Toggle buttons -->
        <div class="lumi-segmented-group" id="arch-toggle" style="margin-left: auto;">
          <button type="button" class="lumi-segmented-btn is-selected" data-arch="swarm">Docker Swarm</button>
          <button type="button" class="lumi-segmented-btn" data-arch="k8s">Kubernetes</button>
        </div>
      </div>
    </div>

    <!-- Diagram Canvas Container -->
    <div class="diagram-card">
      <svg class="diagram-svg" viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="lumi-caret" viewBox="0 0 10 10" refX="7.5" refY="5"
                  markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
            <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--on-surface)"
                  stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
          <marker id="lumi-caret-primary" viewBox="0 0 10 10" refX="7.5" refY="5"
                  markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
            <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--primary)"
                  stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <!-- ================= SHARED CLIENT / CLI NODE ================= -->
        <g class="arch-node" data-node-key="cli">
          <rect x="20" y="30" width="100" height="70" rx="12" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1.2"/>
          <text x="70" y="58" font-family="var(--ff-sans)" font-size="14" font-weight="500" fill="var(--on-surface)" text-anchor="middle">CLI / User</text>
          <text id="cli-subtext" x="70" y="76" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface-variant)" text-anchor="middle">docker service</text>
        </g>

        <!-- Dynamic Connectors CLI -> Control Plane / Manager -->
        <path id="cli-flow-line" d="M 128 65 L 182 65" fill="none" stroke="var(--primary)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0 4" marker-end="url(#lumi-caret-primary)"/>
        <rect id="cli-pill-bg" x="132" y="55" width="46" height="20" rx="10" fill="var(--surface)"/>
        <text id="cli-pill-text" x="155" y="69" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface)" text-anchor="middle">deploy</text>

        <!-- ================= DOCKER SWARM GRAPH ================= -->
        <g id="swarm-graph" class="node-group">
          <!-- Connectors Manager -> Workers -->
          <path d="M 320 120 L 320 160 Q 320 175 304 175 L 176 175 Q 160 175 160 190 L 160 202" fill="none" stroke="var(--on-surface)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0 4" marker-end="url(#lumi-caret)"/>
          <path d="M 440 120 L 440 160 Q 440 175 456 175 L 464 175 Q 480 175 480 190 L 480 202" fill="none" stroke="var(--on-surface)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0 4" marker-end="url(#lumi-caret)"/>
          
          <!-- Edge Label Pills -->
          <rect x="210" y="165" width="60" height="20" rx="10" fill="var(--surface)"/>
          <text x="240" y="179" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface)" text-anchor="middle">gRPC / Raft</text>
          
          <rect x="390" y="165" width="60" height="20" rx="10" fill="var(--surface)"/>
          <text x="420" y="179" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface)" text-anchor="middle">gRPC / Raft</text>

          <!-- Swarm Manager Node -->
          <g class="arch-node" data-node-key="swarm-manager">
            <rect x="190" y="20" width="420" height="100" rx="16" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.3"/>
            <text x="210" y="44" font-family="var(--ff-sans)" font-size="14" font-weight="500" fill="var(--on-surface)">Swarm Manager Node</text>
            <text x="210" y="60" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface-variant)">Raft Consensus Cluster Leader</text>
            
            <!-- Subcomponents inside Manager -->
            <g class="arch-node" data-node-key="swarm-discovery">
              <rect x="380" y="35" width="105" height="36" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="432" y="58" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">Service Discovery</text>
            </g>
            <g class="arch-node" data-node-key="swarm-scheduler">
              <rect x="495" y="35" width="100" height="36" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="545" y="58" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">Scheduler</text>
            </g>
            <g class="arch-node" data-node-key="swarm-api">
              <rect x="380" y="76" width="215" height="32" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="487" y="96" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">Docker Engine API / SwarmKit</text>
            </g>
          </g>

          <!-- Swarm Worker 1 -->
          <g class="arch-node" data-node-key="swarm-worker1">
            <rect x="30" y="210" width="260" height="135" rx="16" fill="var(--surface-container)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="50" y="235" font-family="var(--ff-sans)" font-size="13" font-weight="500" fill="var(--on-surface)">Worker Node 1</text>
            
            <!-- Subcomponents Worker 1 -->
            <g class="arch-node" data-node-key="swarm-daemon">
              <rect x="45" y="248" width="230" height="34" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="160" y="270" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">Docker Daemon (dockerd)</text>
            </g>
            <g class="arch-node" data-node-key="swarm-container-a">
              <rect x="45" y="290" width="230" height="40" rx="8" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1"/>
              <text x="160" y="310" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">Task: Container A</text>
              <text x="160" y="324" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface-variant)" text-anchor="middle">Natively Scheduled</text>
            </g>
          </g>

          <!-- Swarm Worker 2 -->
          <g class="arch-node" data-node-key="swarm-worker2">
            <rect x="350" y="210" width="260" height="135" rx="16" fill="var(--surface-container)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="370" y="235" font-family="var(--ff-sans)" font-size="13" font-weight="500" fill="var(--on-surface)">Worker Node 2</text>
            
            <!-- Subcomponents Worker 2 -->
            <g class="arch-node" data-node-key="swarm-daemon">
              <rect x="365" y="248" width="230" height="34" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="480" y="270" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">Docker Daemon (dockerd)</text>
            </g>
            <g class="arch-node" data-node-key="swarm-container-b">
              <rect x="365" y="290" width="230" height="40" rx="8" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1"/>
              <text x="480" y="310" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">Task: Container B</text>
              <text x="480" y="324" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface-variant)" text-anchor="middle">Natively Scheduled</text>
            </g>
          </g>
        </g>

        <!-- ================= KUBERNETES GRAPH ================= -->
        <g id="k8s-graph" class="node-group hidden-group">
          <!-- Connectors API Server -> Worker Kubelets -->
          <path d="M 280 120 L 280 160 Q 280 175 264 175 L 176 175 Q 160 175 160 190 L 160 202" fill="none" stroke="var(--on-surface)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0 4" marker-end="url(#lumi-caret)"/>
          <path d="M 320 120 L 320 160 Q 320 175 336 175 L 464 175 Q 480 175 480 190 L 480 202" fill="none" stroke="var(--on-surface)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0 4" marker-end="url(#lumi-caret)"/>
          
          <!-- Edge Label Pills -->
          <rect x="195" y="165" width="65" height="20" rx="10" fill="var(--surface)"/>
          <text x="227" y="179" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface)" text-anchor="middle">HTTPS / TLS</text>
          
          <rect x="380" y="165" width="65" height="20" rx="10" fill="var(--surface)"/>
          <text x="412" y="179" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface)" text-anchor="middle">HTTPS / TLS</text>

          <!-- Control Plane (Master) -->
          <g class="arch-node" data-node-key="k8s-control-plane">
            <rect x="190" y="18" width="420" height="106" rx="16" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.3"/>
            <text x="205" y="38" font-family="var(--ff-sans)" font-size="14" font-weight="500" fill="var(--on-surface)">Kubernetes Control Plane</text>
            <text x="205" y="53" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface-variant)">Master Architecture Node</text>

            <!-- Subcomponents inside Control Plane -->
            <g class="arch-node" data-node-key="k8s-apiserver">
              <rect x="205" y="62" width="95" height="52" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="252" y="84" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">kube-api</text>
              <text x="252" y="98" font-family="var(--ff-mono)" font-size="12" fill="var(--on-surface-variant)" text-anchor="middle">server</text>
            </g>
            <g class="arch-node" data-node-key="k8s-etcd">
              <rect x="308" y="62" width="85" height="52" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="350" y="84" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">etcd</text>
              <text x="350" y="98" font-family="var(--ff-mono)" font-size="12" fill="var(--on-surface-variant)" text-anchor="middle">Key-Value</text>
            </g>
            <g class="arch-node" data-node-key="k8s-controller">
              <rect x="401" y="62" width="100" height="52" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="451" y="84" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">Controller</text>
              <text x="451" y="98" font-family="var(--ff-mono)" font-size="12" fill="var(--on-surface-variant)" text-anchor="middle">Manager</text>
            </g>
            <g class="arch-node" data-node-key="k8s-scheduler">
              <rect x="509" y="62" width="92" height="52" rx="8" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="555" y="84" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">kube-</text>
              <text x="555" y="98" font-family="var(--ff-mono)" font-size="12" fill="var(--on-surface-variant)" text-anchor="middle">scheduler</text>
            </g>
          </g>

          <!-- K8s Worker Node 1 -->
          <g class="arch-node" data-node-key="k8s-worker1">
            <rect x="30" y="210" width="260" height="135" rx="16" fill="var(--surface-container)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="45" y="232" font-family="var(--ff-sans)" font-size="13" font-weight="500" fill="var(--on-surface)">Worker Node 1</text>
            
            <g class="arch-node" data-node-key="k8s-kubelet">
              <rect x="45" y="242" width="110" height="32" rx="6" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="100" y="262" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">kubelet</text>
            </g>
            <g class="arch-node" data-node-key="k8s-kubeproxy">
              <rect x="162" y="242" width="113" height="32" rx="6" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="218" y="262" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">kube-proxy</text>
            </g>
            
            <!-- Pod A -->
            <g class="arch-node" data-node-key="k8s-pod-a">
              <rect x="45" y="282" width="230" height="52" rx="10" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1"/>
              <text x="160" y="302" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">Pod A (Abstração)</text>
              <text x="160" y="320" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface-variant)" text-anchor="middle">Container A + IP/Volumes</text>
            </g>
          </g>

          <!-- K8s Worker Node 2 -->
          <g class="arch-node" data-node-key="k8s-worker2">
            <rect x="350" y="210" width="260" height="135" rx="16" fill="var(--surface-container)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="365" y="232" font-family="var(--ff-sans)" font-size="13" font-weight="500" fill="var(--on-surface)">Worker Node 2</text>

            <g class="arch-node" data-node-key="k8s-kubelet">
              <rect x="365" y="242" width="110" height="32" rx="6" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="420" y="262" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">kubelet</text>
            </g>
            <g class="arch-node" data-node-key="k8s-kubeproxy">
              <rect x="482" y="242" width="113" height="32" rx="6" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
              <text x="538" y="262" font-family="var(--ff-sans)" font-size="12" fill="var(--on-surface)" text-anchor="middle">kube-proxy</text>
            </g>

            <!-- Pod B -->
            <g class="arch-node" data-node-key="k8s-pod-b">
              <rect x="365" y="282" width="230" height="52" rx="10" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1"/>
              <text x="480" y="302" font-family="var(--ff-sans)" font-size="12" font-weight="500" fill="var(--on-surface)" text-anchor="middle">Pod B (Abstração)</text>
              <text x="480" y="320" font-family="var(--ff-mono)" font-size="12" font-style="italic" fill="var(--on-surface-variant)" text-anchor="middle">Container B + IP/Volumes</text>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <!-- Node Details Panel -->
    <div class="details-card" id="details-panel">
      <div class="details-header">
        <span class="lumi-headline-s" id="detail-title" style="margin:0; font-size:16px;">Selecione um componente</span>
        <span class="details-tag" id="detail-tag">SWARM / K8S</span>
      </div>
      <p class="lumi-body-m" id="detail-desc" style="margin:0; color:var(--on-surface-variant); font-size:14px;">
        Clique nos elementos do diagrama para inspecionar a função de cada componente na arquitetura.
      </p>
    </div>
  </div>

  <script>
    // State Dictionary for details
    const NODE_DETAILS = {
      'cli': {
        swarmTitle: 'Interface de Linha de Comando (Docker CLI)',
        k8sTitle: 'Interface de Linha de Comando (kubectl)',
        swarmTag: 'CLIENTE',
        k8sTag: 'CLIENTE',
        swarmDesc: 'O usuário executa comandos como "docker service create". O CLI se comunica diretamente com a API do Swarm Manager para solicitar o deploy.',
        k8sDesc: 'O usuário executa "kubectl apply -f manifest.yaml". O kubectl valida o arquivo YAML e envia requisições REST autenticadas para o API Server.'
      },
      'swarm-manager': {
        title: 'Swarm Manager Node',
        tag: 'CONTROL PLANE',
        desc: 'Gerencia o estado do cluster, atribui tarefas aos workers e mantém a coerência via algoritmo de consenso Raft. É simples, leve e embutido no próprio Docker Engine.'
      },
      'swarm-discovery': {
        title: 'Service Discovery Intrinseco',
        tag: 'REDE & DNS',
        desc: 'DNS interno do Swarm que atribui um nome de serviço a um IP virtual (VIP), distribuindo requisições entre containers ativos usando IPVS.'
      },
      'swarm-scheduler': {
        title: 'Swarm Scheduler',
        tag: 'ORQUESTRAÇÃO',
        desc: 'Mapeia os serviços declarados em tasks individuais e seleciona nós Workers com capacidade para executar os containers.'
      },
      'swarm-api': {
        title: 'Docker Engine API & SwarmKit',
        tag: 'COMUNICAÇÃO',
        desc: 'Endpoint API nativo do Docker que expõe o controle do SwarmKit para a criação e escalonamento de containers.'
      },
      'swarm-worker1': {
        title: 'Worker Node 1',
        tag: 'EXECUÇÃO',
        desc: 'Nó do cluster encarregado de rodar as tarefas (containers). O daemon local escuta as ordens enviadas pelo Manager.'
      },
      'swarm-worker2': {
        title: 'Worker Node 2',
        tag: 'EXECUÇÃO',
        desc: 'Segundo nó de execução. Se o Worker 1 falhar, o Manager redireciona os containers afetados para o Worker 2.'
      },
      'swarm-daemon': {
        title: 'Docker Daemon (dockerd)',
        tag: 'RUNTIME',
        desc: 'Processo em segundo plano que baixa imagens, constrói a rede overlay e executa diretamente os containers no host.'
      },
      'swarm-container-a': {
        title: 'Container A (Task)',
        tag: 'UNIDADE DE DEPLOY',
        desc: 'No Swarm, a menor unidade orquestrada é a Task, que executa diretamente um container Docker nativo.'
      },
      'swarm-container-b': {
        title: 'Container B (Task)',
        tag: 'UNIDADE DE DEPLOY',
        desc: 'Container Docker nativo isolado rodando no Worker Node 2, mantido ativo de forma declarativa pelo Swarm.'
      },
      'k8s-control-plane': {
        title: 'Kubernetes Control Plane (Master)',
        tag: 'CONTROL PLANE',
        desc: 'Cérebro do Kubernetes. Coleção de componentes desacoplados que tomam decisões globais, detectam e reagem a eventos do cluster.'
      },
      'k8s-apiserver': {
        title: 'kube-apiserver',
        tag: 'API CORE',
        desc: 'Front-end do Control Plane. Único componente que conversa diretamente com o banco etcd e valida todas as requisições do cluster.'
      },
      'k8s-etcd': {
        title: 'etcd Key-Value Store',
        tag: 'ESTADO PERSISTENTE',
        desc: 'Banco de dados chave-valor distribuído e altamente disponível que armazena a verdade absoluta e o estado de todo o cluster K8s.'
      },
      'k8s-controller': {
        title: 'kube-controller-manager',
        tag: 'RECUPERAÇÃO & LOOPS',
        desc: 'Executa os loops de controle (Node Controller, ReplicaSet Controller) comparando continuamente o estado atual do cluster com o desejado.'
      },
      'k8s-scheduler': {
        title: 'kube-scheduler',
        tag: 'ALOCAÇÃO',
        desc: 'Analisa novos Pods sem nó atribuído e escolhe o melhor Worker Node com base em recursos disponíveis, afinidades e restrições.'
      },
      'k8s-worker1': {
        title: 'Worker Node 1',
        tag: 'EXECUÇÃO',
        desc: 'Máquina (física ou VM) que executa a carga de trabalho do usuário sob comando do Control Plane.'
      },
      'k8s-worker2': {
        title: 'Worker Node 2',
        tag: 'EXECUÇÃO',
        desc: 'Nó de trabalho secundário mantendo a alta disponibilidade das cargas de trabalho distribuídas pelo Kubernetes.'
      },
      'k8s-kubelet': {
        title: 'kubelet Agent',
        tag: 'AGENTE LOCAL',
        desc: 'Agente executado em cada nó. Garante que os containers descritos nos PodSpecs estejam rodando de forma saudável.'
      },
      'k8s-kubeproxy': {
        title: 'kube-proxy',
        tag: 'REDE DE NÓ',
        desc: 'Proxy de rede mantido em cada nó. Gerencia as regras de firewall e IPVS/iptables para viabilizar a comunicação entre Services e Pods.'
      },
      'k8s-pod-a': {
        title: 'Pod A (Menor Unidade K8s)',
        tag: 'ABSTRAÇÃO POD',
        desc: 'O Kubernetes não roda containers diretamente: ele envolve um ou mais containers em um Pod, compartilhando IP, rede e volumes.'
      },
      'k8s-pod-b': {
        title: 'Pod B (Menor Unidade K8s)',
        tag: 'ABSTRAÇÃO POD',
        desc: 'Abstração que contém o Container B. Possui seu próprio IP único dentro do cluster independente de qual nó esteja alocado.'
      }
    };

    const state = {
      arch: 'swarm', // 'swarm' | 'k8s'
      selectedNode: 'cli'
    };

    function updateViz() {
      const isSwarm = state.arch === 'swarm';

      // 1. Update UI Toggle Buttons
      document.querySelectorAll('#arch-toggle button').forEach(btn => {
        const matches = btn.dataset.arch === state.arch;
        btn.classList.toggle('is-selected', matches);
      });

      // 2. Toggle SVG Layout Groups
      const swarmGroup = document.getElementById('swarm-graph');
      const k8sGroup = document.getElementById('k8s-graph');
      
      if (isSwarm) {
        swarmGroup.classList.remove('hidden-group');
        k8sGroup.classList.add('hidden-group');
      } else {
        swarmGroup.classList.add('hidden-group');
        k8sGroup.classList.remove('hidden-group');
      }

      // 3. Update CLI subtext & connectors
      const cliSubtext = document.getElementById('cli-subtext');
      const cliPillText = document.getElementById('cli-pill-text');
      if (cliSubtext && cliPillText) {
        if (cliSubtext) cliSubtext.textContent = isSwarm ? 'docker service' : 'kubectl apply';
        if (cliPillText) cliPillText.textContent = isSwarm ? 'deploy' : 'REST API';
      }

      // 4. Update Node Selection Highlighting
      document.querySelectorAll('.arch-node').forEach(node => {
        const key = node.dataset.nodeKey;
        const isSelected = (key === state.selectedNode);
        node.classList.toggle('is-selected', isSelected);
      });

      // 5. Update Details Panel
      renderDetails();
    }

    function renderDetails() {
      const titleEl = document.getElementById('detail-title');
      const tagEl = document.getElementById('detail-tag');
      const descEl = document.getElementById('detail-desc');

      const key = state.selectedNode || 'cli';
      const info = NODE_DETAILS[key];

      if (!info) {
        if (titleEl) titleEl.textContent = 'Componente Selecionado';
        if (tagEl) tagEl.textContent = state.arch.toUpperCase();
        if (descEl) descEl.textContent = 'Clique em qualquer nó do diagrama para inspecionar seus detalhes arquiteturais.';
        return;
      }

      const isSwarm = state.arch === 'swarm';

      if (key === 'cli') {
        if (titleEl) titleEl.textContent = isSwarm ? info.swarmTitle : info.k8sTitle;
        if (tagEl) tagEl.textContent = isSwarm ? info.swarmTag : info.k8sTag;
        if (descEl) descEl.textContent = isSwarm ? info.swarmDesc : info.k8sDesc;
      } else {
        if (titleEl) titleEl.textContent = info.title || 'Componente';
        if (tagEl) tagEl.textContent = info.tag || state.arch.toUpperCase();
        if (descEl) descEl.textContent = info.desc || '';
      }
    }

    // Attach Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle button clicks
      document.querySelectorAll('#arch-toggle button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const targetArch = e.target.dataset.arch;
          if (state.arch !== targetArch) {
            state.arch = targetArch;
            // Default selected node to CLI or Manager/Control Plane if node belongs to hidden group
            if (state.selectedNode.startsWith('swarm-') && targetArch === 'k8s') {
              state.selectedNode = 'k8s-control-plane';
            } else if (state.selectedNode.startsWith('k8s-') && targetArch === 'swarm') {
              state.selectedNode = 'swarm-manager';
            }
            updateViz();
          }
        });
      });

      // Node selection clicks
      document.querySelectorAll('.arch-node').forEach(node => {
        node.addEventListener('click', (e) => {
          e.stopPropagation();
          const key = node.dataset.nodeKey;
          if (key) {
            state.selectedNode = key;
            updateViz();
          }
        });
      });

      // Initial Render
      updateViz();
    });
  </script>
</body>
</html>
