<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD de ponta a ponta</title>
  <link rel="stylesheet" href="../lumi-runtime.css">
  <link rel="stylesheet" href="../flow.css">
  <script src="../widget-runtime.js"></script>
</head>
<body>
  <div class="widget-container"></div>
  <script type="application/json" id="flow-spec">
{
  "title": "CI/CD de ponta a ponta",
  "subtitle": "O GitHub Actions constrói a imagem; o Orbit registra a release e faz o deploy por commit no GitOps; o Argo CD aplica",
  "direction": "LR",
  "groups": [
    { "id": "github", "label": "GitHub Actions" },
    { "id": "registry", "label": "Docker Hub" },
    { "id": "orbit", "label": "Orbit One" },
    { "id": "gitops", "label": "Repositório GitOps" },
    { "id": "argo", "label": "Argo CD" },
    { "id": "k8s", "label": "Kubernetes" }
  ],
  "nodes": [
    {
      "id": "pr",
      "label": "Pull request",
      "sub": "ci-pr: lint, validadores e build",
      "group": "github",
      "detail": "Nenhuma suíte de teste roda no CI. O merge depende de lint, validadores e build verdes."
    },
    {
      "id": "merge",
      "label": "Merge na develop",
      "sub": "ci-develop: lint, build e push",
      "kind": "accent",
      "group": "github",
      "detail": "Constrói só os projetos afetados desde o último Build e Push verde e publica a imagem de cada um. Imagem cujo conteúdo não mudou não é publicada de novo."
    },
    {
      "id": "sha",
      "label": "Imagem :<sha>",
      "sub": "atmanadmin/attlas-<ms>",
      "kind": "store",
      "group": "registry",
      "detail": "Imutável: identifica o commit exato do build."
    },
    {
      "id": "release",
      "label": "Release",
      "sub": "semver pelo commit",
      "group": "orbit",
      "detail": "A cada 2 minutos o Orbit lê os runs verdes do ci-develop, confere a imagem no Docker Hub e grava a versão em catalog/<serviço>.yaml. feat sobe a minor, fix e demais tipos sobem a patch, ! ou BREAKING CHANGE sobem a major."
    },
    {
      "id": "cd",
      "label": "CD em ondas",
      "sub": "4 serviços por onda",
      "kind": "accent",
      "group": "orbit",
      "detail": "Com Deploy automático ligado no ambiente, aplica a release mais nova em ondas de 4 serviços. Cada onda espera Synced e Healthy no Argo CD (até 10 min) antes da próxima, com 15 min mínimos entre rollouts. O web-attlas vai por último."
    },
    {
      "id": "catalog",
      "label": "catalog/<serviço>.yaml",
      "sub": "releases publicadas",
      "kind": "store",
      "group": "gitops",
      "detail": "Lista de versões por serviço: tag (sha), versão, título, autor e data."
    },
    {
      "id": "apps",
      "label": "apps/<ambiente>/<serviço>.yaml",
      "sub": "image.tag implantada",
      "kind": "store",
      "group": "gitops",
      "detail": "Cada deploy é um commit que troca a tag: deploy(<env>) ou rollback(<env>)."
    },
    {
      "id": "appset",
      "label": "ApplicationSets",
      "sub": "ambientes x serviços",
      "group": "argo",
      "detail": "attlas (serviços, chart atman-service) e attlas-infra (bancos, filas, gateway, chart atman-infra). Ambiente com deploy automático aplica sozinho; manual espera o sync disparado pelo Orbit."
    },
    {
      "id": "kdev",
      "label": "kind do hub",
      "sub": "ambiente dev",
      "group": "k8s"
    },
    {
      "id": "kother",
      "label": "RKE2 registrado",
      "sub": "sync manual",
      "kind": "muted",
      "group": "k8s"
    }
  ],
  "edges": [
    { "from": "pr", "to": "merge", "label": "merge" },
    { "from": "merge", "to": "sha", "label": "push" },
    { "from": "sha", "to": "release", "label": "tag existe" },
    { "from": "release", "to": "catalog", "label": "commit" },
    { "from": "release", "to": "cd", "label": "versão nova" },
    { "from": "cd", "to": "apps", "label": "commit por onda" },
    { "from": "apps", "to": "appset" },
    { "from": "appset", "to": "kdev", "label": "sync automático" },
    { "from": "appset", "to": "kother", "label": "sync manual" }
  ]
}
  </script>
  <script src="../flow.js"></script>
</body>
</html>
