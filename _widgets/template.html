<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titulo do widget</title>
  <!-- Caminho relativo valido para widget em Docs/<Modulo>/assets/widgets/.
       Outro nivel de pasta exige ajustar a quantidade de "../". -->
  <link rel="stylesheet" href="../../../../_widgets/lumi-runtime.css">
  <script src="../../../../_widgets/widget-runtime.js"></script>
  <style>
    /* Apenas layout do widget. Cor, fonte, raio e espacamento vem de token:
       var(--surface), var(--surface-dim), var(--surface-bright), var(--primary),
       var(--accent-container), var(--on-surface), var(--on-surface-variant),
       var(--outline), var(--stroke-default), var(--chart-1..10),
       var(--spacing-xs|s|m|l|xl), var(--r-s|m|l|full), var(--ff-sans), var(--ff-mono). */
    body {
      margin: 0;
      padding: 0;
      font-family: var(--ff-sans);
      color: var(--on-surface);
      background: transparent;
      overflow-y: hidden;
    }

    .widget-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: var(--spacing-m);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-m);
    }

    .diagram-card {
      background: var(--surface-dim);
      border-radius: var(--r-l);
      padding: var(--spacing-m);
      box-sizing: border-box;
    }

    .diagram-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .arch-node { cursor: pointer; }
    .arch-node:hover > rect { stroke: var(--primary) !important; stroke-width: 2px !important; }
    .arch-node.is-selected > rect { stroke: var(--primary) !important; stroke-width: 2.2px !important; fill: var(--accent-container) !important; }
    text { stroke: none !important; paint-order: fill; user-select: none; }
  </style>
</head>
<body>
  <!-- .widget-container e obrigatorio: e o elemento medido para a altura do iframe. -->
  <div class="widget-container">
    <div class="controls-bar" style="display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-s); flex-wrap:wrap;">
      <div>
        <h2 class="lumi-headline-m" style="margin:0; color:var(--on-surface);">Titulo</h2>
        <p class="lumi-body-s" style="margin:2px 0 0 0; color:var(--on-surface-variant);">Subtitulo</p>
      </div>
      <div class="lumi-segmented-group" id="view-toggle" style="margin-left:auto;">
        <button type="button" class="lumi-segmented-btn is-selected" data-view="a">Visao A</button>
        <button type="button" class="lumi-segmented-btn" data-view="b">Visao B</button>
      </div>
    </div>

    <div class="diagram-card">
      <svg class="diagram-svg" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
        <g class="arch-node" data-node-key="exemplo">
          <rect x="20" y="20" width="200" height="60" rx="12" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1.2"/>
          <text x="120" y="55" font-family="var(--ff-sans)" font-size="14" font-weight="500" fill="var(--on-surface)" text-anchor="middle">No de exemplo</text>
        </g>
      </svg>
    </div>
  </div>

  <script>
    const state = { view: 'a', selectedNode: 'exemplo' };

    // Nome fixo: widget-runtime.js chama updateViz() a cada troca de tema.
    function updateViz() {
      document.querySelectorAll('#view-toggle button').forEach((btn) => {
        btn.classList.toggle('is-selected', btn.dataset.view === state.view);
      });
      document.querySelectorAll('.arch-node').forEach((node) => {
        node.classList.toggle('is-selected', node.dataset.nodeKey === state.selectedNode);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('#view-toggle button').forEach((btn) => {
        btn.addEventListener('click', () => { state.view = btn.dataset.view; updateViz(); });
      });
      document.querySelectorAll('.arch-node').forEach((node) => {
        node.addEventListener('click', () => { state.selectedNode = node.dataset.nodeKey; updateViz(); });
      });
      updateViz();
    });
  </script>
</body>
</html>
