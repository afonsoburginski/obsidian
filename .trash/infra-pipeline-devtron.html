<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline de CI/CD com Devtron</title>
  <link rel="stylesheet" href="../lumi-runtime.css">
  <link rel="stylesheet" href="../flow.css">
  <script src="../widget-runtime.js"></script>
</head>
<body>
  <div class="widget-container"></div>
  <script type="application/json" id="flow-spec">
{
  "title": "Pipeline de CI/CD com Devtron",
  "subtitle": "GitHub Actions constrói e versiona; o Devtron implanta e reverte",
  "direction": "LR",
  "groups": [
    { "id": "github", "label": "GitHub Actions" },
    { "id": "registry", "label": "Docker Hub" },
    { "id": "devtron", "label": "Devtron" },
    { "id": "k8s", "label": "Kubernetes" }
  ],
  "nodes": [
    {
      "id": "pr",
      "label": "Pull request",
      "sub": "ci-pr: lint e testes",
      "group": "github",
      "detail": "Sem mudança. O ci-pr segue rodando lint, testes e validadores só dos projetos afetados."
    },
    {
      "id": "build",
      "label": "Merge na develop",
      "sub": "ci-develop: build dos afetados",
      "kind": "accent",
      "group": "github",
      "detail": "Sem mudança no build: nx affected, pulo por hash de conteúdo e push das imagens :dev e :<sha>."
    },
    {
      "id": "notify",
      "label": "notify-devtron",
      "sub": "job novo no ci-develop",
      "kind": "accent",
      "group": "github",
      "detail": "Para cada serviço publicado, chama POST /orchestrator/webhook/ext-ci/<id> com a imagem :<sha> e os dados do commit. Usa os secrets DEVTRON_URL e DEVTRON_API_TOKEN."
    },
    {
      "id": "release",
      "label": "release.yml",
      "sub": "manual: nx release",
      "group": "github",
      "detail": "Disparado à mão quando há algo para entregar a cliente. O nx release calcula a versão de cada serviço pelos commits convencionais, gera o CHANGELOG e a tag git <projeto>@<versão>."
    },
    {
      "id": "sha",
      "label": "Imagem :<sha>",
      "sub": "atmanadmin/attlas-<ms>",
      "kind": "store",
      "group": "registry",
      "detail": "Imutável: identifica exatamente o commit. É o que vai para o dev."
    },
    {
      "id": "version",
      "label": "Imagem :<versão>",
      "sub": "retag do :<sha>",
      "kind": "store",
      "group": "registry",
      "detail": "A mesma imagem do :<sha> testado no dev, com a tag semver acrescentada por docker buildx imagetools create. Não há rebuild."
    },
    {
      "id": "artifact",
      "label": "Artefato",
      "sub": "imagem registrada no app",
      "kind": "store",
      "group": "devtron",
      "detail": "Cada aviso do CI vira um artefato na aplicação, com imagem, commit e data. É a lista de onde se escolhe o que implantar."
    },
    {
      "id": "cddev",
      "label": "CD dev",
      "sub": "automático",
      "kind": "accent",
      "group": "devtron",
      "detail": "Imagem nova chega e o deploy no dev dispara sozinho. Rolling update sem queda: o pod velho só sai com o novo pronto."
    },
    {
      "id": "cdcli",
      "label": "CD cliente",
      "sub": "manual, versão escolhida",
      "kind": "decision",
      "group": "devtron",
      "detail": "Só implanta quando alguém escolhe a versão e aperta deploy (ADR 25). A aprovação formal depende de o recurso estar na edição OSS; se não estiver, a aprovação fica no PR do release."
    },
    {
      "id": "rollback",
      "label": "Rollback",
      "sub": "release anterior",
      "kind": "muted",
      "group": "devtron",
      "detail": "No histórico de deploys da aplicação, escolher uma release anterior e reverter. Vale para dev e cliente."
    },
    {
      "id": "kdev",
      "label": "Cluster dev",
      "sub": "namespace attlas",
      "group": "k8s"
    },
    {
      "id": "kcli",
      "label": "Cluster do cliente",
      "sub": "um por cliente",
      "group": "k8s"
    }
  ],
  "edges": [
    { "from": "pr", "to": "build", "label": "merge" },
    { "from": "build", "to": "sha", "label": "push" },
    { "from": "build", "to": "notify" },
    { "from": "notify", "to": "artifact", "label": "webhook" },
    { "from": "release", "to": "version", "label": "retag" },
    { "from": "release", "to": "artifact", "label": "webhook", "dashed": true },
    { "from": "artifact", "to": "cddev", "label": ":<sha>" },
    { "from": "artifact", "to": "cdcli", "label": ":<versão>" },
    { "from": "cddev", "to": "kdev", "label": "helm upgrade" },
    { "from": "cdcli", "to": "kcli", "label": "helm upgrade" },
    { "from": "rollback", "to": "cddev", "dashed": true },
    { "from": "rollback", "to": "cdcli", "dashed": true }
  ]
}
  </script>
  <script src="../flow.js"></script>
</body>
</html>
